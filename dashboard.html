<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financial Dashboard | Finance Lab</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .dashboard-progress {
            margin-top: 30px;
            padding: 28px;
            background: #ffffff;
            border: 1px solid #e4e2dc;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(11,18,32,0.06);
        }

        .progress-item {
            margin-bottom: 24px;
        }

        .progress-item:last-child {
            margin-bottom: 0;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 9px;
        }

        .progress-header span {
            color: #596273;
            font-size: 14px;
        }

        .progress-header strong {
            color: #0b1220;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 9px;
            background: #eef0f4;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #5b8def;
            border-radius: 20px;
            transition: width 0.5s ease;
        }

        @media (max-width: 600px) {
            .dashboard-progress {
                padding: 22px 18px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        Finance Lab
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="tools.html">Tools</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="learn.html">Learn</a>
        <a href="audit.html">Audit</a>
        <a href="quiz.html">Challenge</a>
        <a href="health.html">Health</a>
    </nav>

</header>


<main class="dashboard-page">

    <section class="dashboard-header">

        <p class="eyebrow">
            FINANCIAL DASHBOARD
        </p>

        <h1>
            See your finances
            <span>at a glance.</span>
        </h1>

        <p>
            Enter your monthly numbers to create a
            simple financial snapshot.
        </p>

    </section>


    <section class="dashboard-input-card">

        <div class="dashboard-form-grid">

            <div class="form-group">

                <label for="income">
                    Monthly Income
                </label>

                <input
                    type="number"
                    id="income"
                    placeholder="Example: 50000"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="form-group">

                <label for="expenses">
                    Monthly Expenses
                </label>

                <input
                    type="number"
                    id="expenses"
                    placeholder="Example: 30000"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="form-group">

                <label for="savings">
                    Monthly Savings
                </label>

                <input
                    type="number"
                    id="savings"
                    placeholder="Example: 10000"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="form-group">

                <label for="debt">
                    Monthly Debt Payment
                </label>

                <input
                    type="number"
                    id="debt"
                    placeholder="Example: 5000"
                    min="0"
                    step="0.01"
                >

            </div>

        </div>


        <button onclick="generateDashboard()">
            Generate Dashboard
        </button>

    </section>


    <section
        id="dashboardResult"
        class="dashboard-results">
    </section>

</main>


<footer>

    <div class="footer-inner">

        <div>

            <div class="logo footer-logo">
                Finance Lab
            </div>

            <p>
                Practical finance tools for smarter decisions.
            </p>

        </div>

    </div>


    <div class="footer-bottom">
        © 2026 Finance Lab
    </div>

</footer>


<script>

function generateDashboard() {

    const incomeInput =
        document.getElementById("income").value.trim();

    const expensesInput =
        document.getElementById("expenses").value.trim();

    const savingsInput =
        document.getElementById("savings").value.trim();

    const debtInput =
        document.getElementById("debt").value.trim();


    document.getElementById("dashboardResult").innerHTML = "";


    /* =========================
       VALIDATION
    ========================= */

    if (
        incomeInput === "" ||
        expensesInput === "" ||
        savingsInput === "" ||
        debtInput === ""
    ) {

        showDashboardError(
            "Missing information",
            "Please complete all four fields before generating the dashboard."
        );

        return;
    }


    const income = Number(incomeInput);
    const expenses = Number(expensesInput);
    const savings = Number(savingsInput);
    const debt = Number(debtInput);


    if (
        !Number.isFinite(income) ||
        !Number.isFinite(expenses) ||
        !Number.isFinite(savings) ||
        !Number.isFinite(debt)
    ) {

        showDashboardError(
            "Invalid input",
            "Please enter valid numeric values."
        );

        return;
    }


    if (income <= 0) {

        showDashboardError(
            "Invalid income",
            "Monthly income must be greater than ₹0."
        );

        return;
    }


    if (
        expenses < 0 ||
        savings < 0 ||
        debt < 0
    ) {

        showDashboardError(
            "Invalid amount",
            "Expenses, savings and debt payments cannot be negative."
        );

        return;
    }


    /* =========================
       CALCULATIONS
    ========================= */

    const remaining =
        income - expenses;

    const savingsRate =
        (savings / income) * 100;

    const expenseRate =
        (expenses / income) * 100;

    const debtRate =
        (debt / income) * 100;


    /* =========================
       STATUS
    ========================= */

    let status;

    if (remaining < 0) {

        status = "Review Needed";

    } else if (
        savingsRate >= 20 &&
        debtRate < 30 &&
        expenseRate <= 70
    ) {

        status = "Healthy Balance";

    } else if (
        savingsRate < 10 ||
        debtRate > 40 ||
        expenseRate > 80
    ) {

        status = "Review Needed";

    } else {

        status = "Balanced";
    }


    /* =========================
       INSIGHT
    ========================= */

    const message =
        getDashboardMessage(
            savingsRate,
            expenseRate,
            debtRate,
            remaining
        );


    /* =========================
       PROGRESS BAR VALUES
    ========================= */

    const savingsBar =
        Math.min(Math.max(savingsRate, 0), 100);

    const expenseBar =
        Math.min(Math.max(expenseRate, 0), 100);

    const debtBar =
        Math.min(Math.max(debtRate, 0), 100);


    /* =========================
       RESULT
    ========================= */

    document.getElementById("dashboardResult").innerHTML = `

        <div class="dashboard-grid">

            <div class="dashboard-stat">

                <span>
                    Monthly Income
                </span>

                <strong>
                    ₹${income.toFixed(2)}
                </strong>

            </div>


            <div class="dashboard-stat">

                <span>
                    Monthly Expenses
                </span>

                <strong>
                    ₹${expenses.toFixed(2)}
                </strong>

            </div>


            <div class="dashboard-stat">

                <span>
                    Remaining Balance
                </span>

                <strong>
                    ₹${Math.max(0, remaining).toFixed(2)}
                </strong>

            </div>


            <div class="dashboard-stat">

                <span>
                    Financial Status
                </span>

                <strong>
                    ${status}
                </strong>

            </div>

        </div>


        <div class="dashboard-detail-grid">

            <div class="dashboard-detail">

                <span>
                    Savings Rate
                </span>

                <strong>
                    ${savingsRate.toFixed(1)}%
                </strong>

                <p>
                    Monthly savings compared
                    with monthly income.
                </p>

            </div>


            <div class="dashboard-detail">

                <span>
                    Expense Rate
                </span>

                <strong>
                    ${expenseRate.toFixed(1)}%
                </strong>

                <p>
                    Monthly expenses compared
                    with monthly income.
                </p>

            </div>


            <div class="dashboard-detail">

                <span>
                    Debt Rate
                </span>

                <strong>
                    ${debtRate.toFixed(1)}%
                </strong>

                <p>
                    Monthly debt payment compared
                    with monthly income.
                </p>

            </div>

        </div>


        <div class="dashboard-progress">

            <div class="progress-item">

                <div class="progress-header">

                    <span>
                        Savings Rate
                    </span>

                    <strong>
                        ${savingsRate.toFixed(1)}%
                    </strong>

                </div>

                <div class="progress-bar">

                    <div
                        class="progress-fill"
                        style="width: ${savingsBar}%">
                    </div>

                </div>

            </div>


            <div class="progress-item">

                <div class="progress-header">

                    <span>
                        Expense Rate
                    </span>

                    <strong>
                        ${expenseRate.toFixed(1)}%
                    </strong>

                </div>

                <div class="progress-bar">

                    <div
                        class="progress-fill"
                        style="width: ${expenseBar}%">
                    </div>

                </div>

            </div>


            <div class="progress-item">

                <div class="progress-header">

                    <span>
                        Debt Rate
                    </span>

                    <strong>
                        ${debtRate.toFixed(1)}%
                    </strong>

                </div>

                <div class="progress-bar">

                    <div
                        class="progress-fill"
                        style="width: ${debtBar}%">
                    </div>

                </div>

            </div>

        </div>


        <div class="insight-box">

            <h3>
                Dashboard Insight
            </h3>

            <p>
                ${message}
            </p>

            <p>
                This dashboard is an educational snapshot,
                not professional financial advice.
            </p>

        </div>

    `;
}


/* =========================
   DASHBOARD MESSAGE
========================= */

function getDashboardMessage(
    savingsRate,
    expenseRate,
    debtRate,
    remaining
) {

    if (remaining < 0) {

        return "Your expenses are higher than your income. Your first priority may be understanding which expenses are creating the largest monthly pressure.";

    }


    if (
        savingsRate >= 20 &&
        debtRate < 30 &&
        expenseRate <= 70
    ) {

        return "Your current numbers show a relatively healthy monthly balance between spending, saving and debt payments.";

    }


    if (savingsRate < 10) {

        return "Your savings rate is relatively low. Reviewing recurring expenses may help create more room for saving.";

    }


    if (debtRate > 40) {

        return "A significant portion of your income is going toward debt payments. Tracking this ratio can help you understand monthly financial pressure.";

    }


    if (expenseRate > 80) {

        return "Most of your income is being used by expenses. Reviewing your largest spending categories may create more flexibility.";

    }


    return "Your current numbers show a reasonably balanced monthly position. Continue tracking your income, expenses and savings regularly.";
}


/* =========================
   ERROR
========================= */

function showDashboardError(title, message) {

    document.getElementById("dashboardResult").innerHTML = `

        <div class="insight-box">

            <h3>
                ${title}
            </h3>

            <p>
                ${message}
            </p>

        </div>

    `;
}

</script>

</body>

</html>
