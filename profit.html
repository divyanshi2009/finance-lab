<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profit & Loss | Finance Lab</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        Finance Lab
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="tools.html">Tools</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="learn.html">Learn</a>
        <a href="quiz.html">Challenge</a>
        <a href="health.html">Health</a>
    </nav>

</header>


<main class="calculator-page">

    <div class="calculator-header">

        <p class="eyebrow">
            FINANCIAL TOOL
        </p>

        <h1>Profit &amp; Loss Calculator</h1>

        <p>
            Calculate profit, loss and profit margin
            using revenue and expenses.
        </p>

    </div>


    <div class="calculator-card">

        <div class="form-group">

            <label for="sales">
                Sales / Revenue
            </label>

            <input
                type="number"
                id="sales"
                placeholder="Enter sales amount"
                min="0"
                step="0.01"
            >

        </div>


        <div class="form-group">

            <label for="expenses">
                Total Expenses
            </label>

            <input
                type="number"
                id="expenses"
                placeholder="Enter total expenses"
                min="0"
                step="0.01"
            >

        </div>


        <button onclick="calculateProfit()">
            Calculate
        </button>


        <div id="result"></div>

        <div id="insight"></div>

    </div>

</main>


<footer>

    <div class="footer-inner">

        <div>

            <div class="logo footer-logo">
                Finance Lab
            </div>

            <p>
                Practical finance tools for smarter decisions.
            </p>

        </div>


        <div class="footer-links">

            <a href="index.html">Home</a>
            <a href="tools.html">Tools</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="learn.html">Learn</a>
            <a href="health.html">Health</a>

        </div>

    </div>


    <div class="footer-bottom">
        © 2026 Finance Lab
    </div>

</footer>


<script>

function calculateProfit() {

    const salesInput =
        document.getElementById("sales").value.trim();

    const expensesInput =
        document.getElementById("expenses").value.trim();


    // Clear previous messages

    document.getElementById("result").innerHTML = "";
    document.getElementById("insight").innerHTML = "";


    // Check empty inputs

    if (salesInput === "" || expensesInput === "") {

        showError(
            "Missing information",
            "Please enter both sales/revenue and total expenses."
        );

        return;
    }


    const sales = Number(salesInput);
    const expenses = Number(expensesInput);


    // Check invalid numbers

    if (!Number.isFinite(sales) || !Number.isFinite(expenses)) {

        showError(
            "Invalid amount",
            "Please enter valid numeric values."
        );

        return;
    }


    // Check negative values

    if (sales < 0 || expenses < 0) {

        showError(
            "Invalid amount",
            "Sales and expenses cannot be negative."
        );

        return;
    }


    // Calculate profit

    const profit = sales - expenses;


    // Calculate margin

    let margin = 0;

    if (sales > 0) {

        margin = (profit / sales) * 100;

    }


    const status =
        profit >= 0 ? "Profit" : "Loss";


    // Show result

    document.getElementById("result").innerHTML = `

        <div class="result-box">

            <div class="result-row">

                <span>
                    Revenue
                </span>

                <strong>
                    ₹${sales.toFixed(2)}
                </strong>

            </div>


            <div class="result-row">

                <span>
                    Expenses
                </span>

                <strong>
                    ₹${expenses.toFixed(2)}
                </strong>

            </div>


            <div class="result-row">

                <span>
                    ${status}
                </span>

                <strong class="profit">
                    ₹${Math.abs(profit).toFixed(2)}
                </strong>

            </div>


            <div class="result-row">

                <span>
                    Profit Margin
                </span>

                <strong>
                    ${margin.toFixed(2)}%
                </strong>

            </div>

        </div>

    `;


    // Show financial insight

    showInsight(profit, margin, sales);

}


function showInsight(profit, margin, sales) {

    let message = "";


    if (profit < 0) {

        message =
            "Your expenses are higher than your revenue, so the current calculation shows a loss.";

    }
    else if (sales === 0) {

        message =
            "There is no revenue entered, so a meaningful profit margin cannot be calculated.";

    }
    else if (margin < 10) {

        message =
            "The business is profitable, but the profit margin is relatively low. Keeping expenses under control could improve profitability.";

    }
    else if (margin < 25) {

        message =
            "The business has a moderate profit margin. Regular expense tracking can help maintain profitability.";

    }
    else {

        message =
            "The business has a strong profit margin. A larger portion of revenue is being retained as profit.";

    }


    document.getElementById("insight").innerHTML = `

        <div class="insight-box">

            <h3>
                Financial Insight
            </h3>

            <p>
                ${message}
            </p>

        </div>

    `;
}


function showError(title, message) {

    document.getElementById("result").innerHTML = `

        <div class="insight-box">

            <h3>
                ${title}
            </h3>

            <p>
                ${message}
            </p>

        </div>

    `;
}

</script>

</body>

</html>
