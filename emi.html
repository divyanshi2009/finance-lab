<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMI Calculator | Finance Lab</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        Finance Lab
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="tools.html">Tools</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="learn.html">Learn</a>
        <a href="quiz.html">Challenge</a>
        <a href="health.html">Health</a>
    </nav>

</header>


<main class="calculator-page">

    <div class="calculator-header">

        <p class="eyebrow">
            FINANCIAL TOOL
        </p>

        <h1>EMI Calculator</h1>

        <p>
            Estimate your monthly EMI, total interest
            and total loan repayment.
        </p>

    </div>


    <div class="calculator-card">

        <div class="form-group">

            <label for="loanAmount">
                Loan Amount
            </label>

            <input
                type="number"
                id="loanAmount"
                placeholder="Example: 500000"
                min="0"
                step="0.01"
            >

        </div>


        <div class="form-group">

            <label for="interestRate">
                Annual Interest Rate (%)
            </label>

            <input
                type="number"
                id="interestRate"
                placeholder="Example: 8.5"
                min="0"
                step="0.01"
            >

        </div>


        <div class="form-group">

            <label for="loanYears">
                Loan Tenure (Years)
            </label>

            <input
                type="number"
                id="loanYears"
                placeholder="Example: 5"
                min="0"
                step="0.1"
            >

        </div>


        <button onclick="calculateEMI()">
            Calculate EMI
        </button>


        <div id="emiResult"></div>

    </div>

</main>


<footer>

    <div class="footer-inner">

        <div>

            <div class="logo footer-logo">
                Finance Lab
            </div>

            <p>
                Practical finance tools for smarter decisions.
            </p>

        </div>

    </div>

    <div class="footer-bottom">
        © 2026 Finance Lab
    </div>

</footer>


<script>

function calculateEMI() {

    const loanInput =
        document.getElementById("loanAmount").value.trim();

    const rateInput =
        document.getElementById("interestRate").value.trim();

    const yearsInput =
        document.getElementById("loanYears").value.trim();


    document.getElementById("emiResult").innerHTML = "";


    /* =========================
       VALIDATION
    ========================= */

    if (
        loanInput === "" ||
        rateInput === "" ||
        yearsInput === ""
    ) {

        showEMIError(
            "Missing information",
            "Please enter the loan amount, interest rate and loan tenure."
        );

        return;
    }


    const principal = Number(loanInput);
    const annualRate = Number(rateInput);
    const years = Number(yearsInput);


    if (
        !Number.isFinite(principal) ||
        !Number.isFinite(annualRate) ||
        !Number.isFinite(years)
    ) {

        showEMIError(
            "Invalid input",
            "Please enter valid numeric values."
        );

        return;
    }


    if (principal <= 0) {

        showEMIError(
            "Invalid loan amount",
            "Loan amount must be greater than ₹0."
        );

        return;
    }


    if (annualRate < 0) {

        showEMIError(
            "Invalid interest rate",
            "Interest rate cannot be negative."
        );

        return;
    }


    if (years <= 0) {

        showEMIError(
            "Invalid loan tenure",
            "Loan tenure must be greater than 0 years."
        );

        return;
    }


    /* =========================
       CALCULATION
    ========================= */

    const monthlyRate =
        annualRate / 12 / 100;

    const months =
        years * 12;


    let emi;


    if (monthlyRate === 0) {

        emi =
            principal / months;

    } else {

        const factor =
            Math.pow(1 + monthlyRate, months);

        emi =
            principal *
            monthlyRate *
            factor /
            (factor - 1);

    }


    const totalPayment =
        emi * months;

    const totalInterest =
        totalPayment - principal;


    const interestShare =
        (totalInterest / totalPayment) * 100;


    /* =========================
       INSIGHT
    ========================= */

    let message;


    if (annualRate === 0) {

        message =
            "With a 0% interest rate, your total repayment equals the original loan amount.";

    } else if (interestShare > 35) {

        message =
            "A significant portion of the total repayment is interest. A shorter tenure may reduce total interest, although it can increase the monthly EMI.";

    } else {

        message =
            "Your EMI is calculated from the loan amount, annual interest rate and loan tenure. Changing the tenure can significantly change the total interest paid.";

    }


    /* =========================
       RESULT
    ========================= */

    document.getElementById("emiResult").innerHTML = `

        <div class="result-box">

            <div class="result-row">

                <span>
                    Loan Amount
                </span>

                <strong>
                    ₹${principal.toFixed(2)}
                </strong>

            </div>


            <div class="result-row">

                <span>
                    Monthly EMI
                </span>

                <strong class="profit">
                    ₹${emi.toFixed(2)}
                </strong>

            </div>


            <div class="result-row">

                <span>
                    Total Interest
                </span>

                <strong>
                    ₹${totalInterest.toFixed(2)}
                </strong>

            </div>


            <div class="result-row">

                <span>
                    Total Payment
                </span>

                <strong>
                    ₹${totalPayment.toFixed(2)}
                </strong>

            </div>


            <div class="result-row">

                <span>
                    Interest Share
                </span>

                <strong>
                    ${interestShare.toFixed(2)}%
                </strong>

            </div>

        </div>


        <div class="insight-box">

            <h3>
                EMI Insight
            </h3>

            <p>
                ${message}
            </p>

            <p>
                This is an educational estimate and
                actual loan terms may differ.
            </p>

        </div>

    `;
}


/* =========================
   ERROR
========================= */

function showEMIError(title, message) {

    document.getElementById("emiResult").innerHTML = `

        <div class="insight-box">

            <h3>
                ${title}
            </h3>

            <p>
                ${message}
            </p>

        </div>

    `;
}

</script>

</body>

</html>
