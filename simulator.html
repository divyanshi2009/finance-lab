<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>What-If Simulator | Finance Lab</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        Finance Lab
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="tools.html">Tools</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="learn.html">Learn</a>
        <a href="quiz.html">Challenge</a>
        <a href="health.html">Health</a>
    </nav>

</header>


<main class="calculator-page">

    <div class="calculator-header">

        <p class="eyebrow">
            INTERACTIVE FINANCE
        </p>

        <h1>What-If Simulator</h1>

        <p>
            Explore how a change in expenses can affect
            your estimated profit.
        </p>

    </div>


    <div class="calculator-card">

        <div class="form-group">

            <label for="revenue">
                Current Revenue
            </label>

            <input
                type="number"
                id="revenue"
                placeholder="Example: 100000"
                min="0"
                step="0.01"
            >

        </div>


        <div class="form-group">

            <label for="expenses">
                Current Expenses
            </label>

            <input
                type="number"
                id="expenses"
                placeholder="Example: 60000"
                min="0"
                step="0.01"
            >

        </div>


        <div class="form-group">

            <label for="change">
                Expense Change (%)
            </label>

            <input
                type="number"
                id="change"
                placeholder="Example: 10"
                step="0.01"
            >

        </div>


        <button onclick="runSimulation()">
            Run Simulation
        </button>


        <div id="simulationResult"></div>

    </div>

</main>


<footer>

    <div class="footer-inner">

        <div>

            <div class="logo footer-logo">
                Finance Lab
            </div>

            <p>
                Practical finance tools for smarter decisions.
            </p>

        </div>

    </div>

    <div class="footer-bottom">
        © 2026 Finance Lab
    </div>

</footer>


<script>

function runSimulation() {

    const revenueInput =
        document.getElementById("revenue").value.trim();

    const expensesInput =
        document.getElementById("expenses").value.trim();

    const changeInput =
        document.getElementById("change").value.trim();


    document.getElementById("simulationResult").innerHTML = "";


    /* =========================
       VALIDATION
    ========================= */

    if (
        revenueInput === "" ||
        expensesInput === "" ||
        changeInput === ""
    ) {

        showSimulationError(
            "Missing information",
            "Please enter revenue, expenses and the expense change percentage."
        );

        return;
    }


    const revenue = Number(revenueInput);
    const expenses = Number(expensesInput);
    const change = Number(changeInput);


    if (
        !Number.isFinite(revenue) ||
        !Number.isFinite(expenses) ||
        !Number.isFinite(change)
    ) {

        showSimulationError(
            "Invalid input",
            "Please enter valid numeric values."
        );

        return;
    }


    if (revenue <= 0) {

        showSimulationError(
            "Invalid revenue",
            "Revenue must be greater than ₹0."
        );

        return;
    }


    if (expenses < 0) {

        showSimulationError(
            "Invalid expenses",
            "Expenses cannot be negative."
        );

        return;
    }


    if (change <= -100) {

        showSimulationError(
            "Invalid percentage",
            "The expense change cannot reduce expenses to zero or below."
        );

        return;
    }


    /* =========================
       CURRENT POSITION
    ========================= */

    const currentProfit =
        revenue - expenses;


    const currentMargin =
        (currentProfit / revenue) * 100;


    /* =========================
       WHAT-IF POSITION
    ========================= */

    const newExpenses =
        expenses * (1 + change / 100);


    const newProfit =
        revenue - newExpenses;


    const newMargin =
        (newProfit / revenue) * 100;


    const profitDifference =
        newProfit - currentProfit;


    const marginDifference =
        newMargin - currentMargin;


    /* =========================
       INTERPRETATION
    ========================= */

    let direction;
    let message;


    if (profitDifference > 0) {

        direction = "Profit increases";

        message =
            "The simulated expense change improves the estimated profit position.";

    } else if (profitDifference < 0) {

        direction = "Profit decreases";

        message =
            "The simulated expense change reduces the estimated profit position.";

    } else {

        direction = "No profit change";

        message =
            "The simulated expense change produces no difference in estimated profit.";

    }


    /* =========================
       RESULT
    ========================= */

    document.getElementById("simulationResult").innerHTML = `

        <div class="result-box">

            <div class="result-row">

                <span>
                    Current Profit
                </span>

                <strong>
                    ₹${currentProfit.toFixed(2)}
                </strong>

            </div>


            <div class="result-row">

                <span>
                    Current Margin
                </span>

                <strong>
                    ${currentMargin.toFixed(2)}%
                </strong>

            </div>


            <div class="result-row">

                <span>
                    New Expenses
                </span>

                <strong>
                    ₹${newExpenses.toFixed(2)}
                </strong>

            </div>


            <div class="result-row">

                <span>
                    New Profit
                </span>

                <strong class="profit">
                    ₹${newProfit.toFixed(2)}
                </strong>

            </div>


            <div class="result-row">

                <span>
                    New Margin
                </span>

                <strong>
                    ${newMargin.toFixed(2)}%
                </strong>

            </div>


            <div class="result-row">

                <span>
                    Profit Change
                </span>

                <strong>
                    ₹${Math.abs(profitDifference).toFixed(2)}
                </strong>

            </div>


            <div class="result-row">

                <span>
                    Margin Change
                </span>

                <strong>
                    ${marginDifference.toFixed(2)}%
                </strong>

            </div>

        </div>


        <div class="insight-box">

            <h3>
                Scenario Insight
            </h3>

            <p>
                ${direction}
            </p>

            <p>
                ${message}
            </p>

            <p>
                The expense scenario used was
                ${change}%.
            </p>

        </div>

    `;

}


/* =========================
   ERROR
========================= */

function showSimulationError(title, message) {

    document.getElementById("simulationResult").innerHTML = `

        <div class="insight-box">

            <h3>
                ${title}
            </h3>

            <p>
                ${message}
            </p>

        </div>

    `;
}

</script>

</body>
</html>
